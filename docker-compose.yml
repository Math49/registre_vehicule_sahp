# Stack Portainer — Registre des véhicules SAHP
#
# Variables à définir dans Portainer (onglet « Environment variables » de la stack) :
#   ADMIN_USERNAME   premier admin, créé seulement si aucun admin n'existe
#   ADMIN_PASSWORD   son mot de passe (8 caractères min.)
#   COOKIE_SECURE    false si le site est servi en HTTP simple (défaut : true, HTTPS)
#   PORT_HTTP        port exposé sur l'hôte (défaut : 3000)

services:
  registre:
    image: ghcr.io/math49/registre-vehicule-sahp:latest
    container_name: registre-sahp
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-3000}:3000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - registre-data:/app/data

volumes:
  registre-data:
